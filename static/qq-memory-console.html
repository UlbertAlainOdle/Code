<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saya · 记忆操作台</title>
<style>body{margin:0;background:#f5f4f0;color:#293633;font:16px/1.7 system-ui}main{max-width:980px;margin:32px auto;padding:0 22px}header,article,#detail,.settings{background:#fff;border:1px solid #dedfd8;border-radius:16px;padding:22px;margin:16px 0}h1,h2{font-weight:600}h1{margin:12px 0}h2{font-size:19px}p{margin:8px 0}.muted{color:#66716d;font-size:14px}button,input,select,textarea{font:inherit;border:1px solid #b5c3ba;border-radius:8px;padding:8px 12px}button{background:#edf3ed;color:#254936;cursor:pointer}button:disabled{opacity:.5;cursor:default}textarea{box-sizing:border-box;width:100%;min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{min-height:28px}#detail{border:2px solid #b1c8b5}a{color:#375b48}summary{cursor:pointer}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}#items article{margin:0}#command{flex:1;min-width:220px}label{display:inline-block;margin:8px 0}</style>
</head><body><main>
<a href="/static/qq.html">返回 QQ 设置</a>
<header><p class="muted">SAYA · 记忆操作台</p><h1>把值得留下的事，慢慢记好</h1><p>白天整理同一个人的当天对话，日终再由你决定是否保存。重要内容单独等待你确认；普通聊天不逐句询问。</p></header>
<section class="settings"><div class="row"><label>操作账号 <select id="owner"><option value="">正在读取</option></select></label><button id="refresh">刷新</button><a href="/static/Chat4o5-Modern.html">长期记忆管理</a></div><label><input type="checkbox" id="enabled"> 启用每日整理与重要记忆待批</label> <button id="save-policy" disabled>保存设置</button><p class="muted" id="rules"></p><p class="muted">已有日记忆不变，不建立群每日记忆。待确认内容保留三天；离线期间留在这里，回来后再批准，逾期不自动保存。</p></section>
<p id="status" role="status" aria-live="polite"></p>
<section><div class="row"><h2>整理与待决定的内容</h2><select id="filter"><option value="pending">等待确认</option><option value="open">今天正在整理</option><option value="all">最近操作</option></select></div><div id="items"></div></section>
<section id="detail" hidden><h2 id="detail-title"></h2><p id="detail-info" class="muted"></p><div id="previous" hidden><h3>当前记忆</h3><pre id="previous-body"></pre></div><h3>本次完整内容</h3><pre id="body"></pre><details><summary>查看来源与操作详情</summary><pre id="sources"></pre></details><p class="row"><button id="approve">确认保留这份内容</button><button id="reject">不保存这份内容</button><button id="close">收起</button></p></section>
<section class="settings"><h2>查询与操作</h2><form id="command-form" class="row"><input id="command" aria-label="查询或已登记命令" placeholder="查看待确认 / 查看今日 / 查看最近操作"><button>执行</button></form><p class="muted">也可输入原记忆查询命令。保存始终先展开完整内容，再点击确认。</p><pre id="command-result"></pre></section>
</main><script src="/static/js/qq_memory_console.js?v=202-1"></script></body></html>
