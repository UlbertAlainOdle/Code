<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MMD Try Showcase</title>
    <script src="/static/libs/three-r106/three.min.js"></script>
    <script src="/static/libs/three-r106/TGALoader.js"></script>
    <script src="/static/libs/three-r106/OrbitControls.js"></script>
    <script src="/static/libs/three-r106/mmdparser.min.js"></script>
    <script src="/static/libs/three-r106/MMDLoader.js"></script>
    <script src="/static/libs/three-r106/CCDIKSolver.js"></script>
    <script src="/static/libs/three-r106/MMDPhysics.js"></script>
    <script src="/static/libs/three-r106/MMDAnimationHelper.js"></script>
    <script src="/static/libs/three-r106/ammo.js"></script>
    <link rel="stylesheet" href="/static/css/mmd_try_showcase.css?v=20260907-ui2">
</head>
<body>
    <main class="showcase-shell">
        <div class="canvas-container" id="draggable-model">
            <div class="drag-bar" title="Drag to move"></div>
            <div class="resize-handle nw"></div>
            <div class="resize-handle ne"></div>
            <div class="resize-handle sw"></div>
            <div class="resize-handle se"></div>
            <canvas id="mmd-canvas"></canvas>
        </div>

        <section class="showcase-hud" aria-label="Motion controls">
            <div class="motion-info">
                <div class="motion-name" id="motion-name">Loading model...</div>
                <div class="motion-detail" id="motion-detail">Preparing MMD runtime</div>
            </div>
            <div class="motion-actions">
                <button class="motion-list-toggle" id="motion-list-toggle" type="button" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>Motions</button>
                <button class="export-motions" id="export-checked-motions" type="button" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>Export</button>
                <button class="next-motion" id="next-motion" type="button" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Next</button>
            </div>
        </section>

        <section class="motion-list-panel hidden" id="motion-list-panel" aria-label="Motion list">
            <div class="motion-list-header">
                <span id="motion-list-title">Motions</span>
                <button class="motion-list-close" id="motion-list-close" type="button" aria-label="Close"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <div class="motion-list" id="motion-list"></div>
        </section>

        <div class="loading-panel" id="loading-panel">
            <div class="loading-title" id="loading-title">Loading model...</div>
            <div class="loading-detail" id="loading-detail">Please wait</div>
        </div>
    </main>

    <link rel="stylesheet" href="/static/css/qq_settings.css?v=20261028-runtime-final">
    <script src="/static/js/local_settings.js?v=20261028-runtime-final"></script>
    <script src="/static/js/settings_tool_boot.js?v=20261028-runtime-final"></script>
</body>
</html>
